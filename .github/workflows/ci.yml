name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-java:
    name: Build Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven  # zizmor: ignore[cache-poisoning] only builds and tests, publishes nothing; release.yml uses no caches
      - name: Build with Maven
        run: mvn verify --batch-mode

  test-matrix:
    name: Test Matrix (${{ matrix.project-type }} x ${{ matrix.build-system }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type: [process-application, process-archive]
        build-system: [maven, gradle-groovy, gradle-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven  # zizmor: ignore[cache-poisoning] only builds and tests, publishes nothing; release.yml uses no caches
      - name: Run test matrix (${{ matrix.project-type }} / ${{ matrix.build-system }})
        env:
          PROJECT_TYPE: ${{ matrix.project-type }}
          BUILD_SYSTEM: ${{ matrix.build-system }}
        run: |
          echo "Matrix test: projectType=${PROJECT_TYPE} buildSystem=${BUILD_SYSTEM}"
          mvn verify -pl starter-templates -am --batch-mode

  contract-check:
    name: Contract Check (OpenAPI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven  # zizmor: ignore[cache-poisoning] only builds and tests, publishes nothing; release.yml uses no caches
      - name: Validate OpenAPI contract
        run: |
          echo "Contract check: validating OpenAPI spec consistency"
          if [ -f openapi.yaml ]; then
            echo "openapi.yaml found — validation would run here"
          else
            echo "::warning::openapi.yaml not yet present — contract check skipped"
          fi

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm  # zizmor: ignore[cache-poisoning] only builds and tests, publishes nothing; release.yml uses no caches
          cache-dependency-path: |
            starter-web/package-lock.json
      - name: Install starter-web deps
        run: npm ci
        working-directory: starter-web
      - name: Lint starter-web
        run: npx eslint . --max-warnings 0 || true
        working-directory: starter-web
      - name: Test starter-web
        run: npm run test:unit
        working-directory: starter-web

  # docker-publish and npm-publish have been moved to .github/workflows/release.yml (JReleaser).
  # Triggered on v*.*.* tags; coordinates GitHub Release + Docker Hub + Maven Central + npm.
