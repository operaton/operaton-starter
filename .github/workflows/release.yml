name: Release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'The next development version to set (without -SNAPSHOT suffix). Leave empty to auto-compute based on branch.'
        required: false
        default: ''
      preliminary_release_qualifier:
        description: 'Optional preliminary release qualifier. Must match M[0-9], RC[0-9] or SNAPSHOT.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-Run: Skips remote operations when true'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      next_version: ${{steps.version.outputs.next_version}}
      version: ${{steps.version.outputs.version}}
      base_version: ${{steps.version.outputs.base_version}}
      is_prerelease: ${{steps.version.outputs.is_prerelease}}
      is_latest: ${{steps.latest.outputs.is_latest}}
      is_latest_major: ${{steps.latest.outputs.is_latest_major}}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compute next development version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.next_version }}
          BRANCH_NAME: ${{ github.ref_name }}
          QUALIFIER: ${{ inputs.preliminary_release_qualifier }}
        run: |

          if [ -n "$INPUT_VERSION" ]; then
            # Use the provided version
            echo "next_version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Using provided next version: $INPUT_VERSION"
          else
            # Compute version based on branch
            CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tail -n 1 | sed -e 's/-SNAPSHOT//')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "::error::Failed to retrieve current version from pom.xml"
              exit 1
            fi
            echo "Current version (without -SNAPSHOT): $CURRENT_VERSION"

            if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              SUFFIX="${BASH_REMATCH[4]}"

              if [ "$BRANCH_NAME" == "main" ]; then
                # main branch: increment minor, set patch to 0
                NEXT_MINOR=$((MINOR + 1))
                COMPUTED_VERSION="${MAJOR}.${NEXT_MINOR}.0${SUFFIX}"
                echo "Branch 'main': incrementing minor version"
              elif [[ "$BRANCH_NAME" =~ ^release/ ]]; then
                # release/* branches: increment patch
                NEXT_PATCH=$((PATCH + 1))
                COMPUTED_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}${SUFFIX}"
                echo "Branch '$BRANCH_NAME': incrementing patch version"
              else
                echo "::error::Cannot auto-compute next version for branch '$BRANCH_NAME'. Please provide the next_version input explicitly."
                exit 1
              fi

              echo "next_version=$COMPUTED_VERSION" >> $GITHUB_OUTPUT
              echo "Computed next version: $COMPUTED_VERSION"
            else
              echo "::error::Unable to parse current version '$CURRENT_VERSION'. Please provide the next_version input explicitly."
              exit 1
            fi
          fi
          BASE_RELEASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tail -n 1 | sed -e 's/-SNAPSHOT//')
          if [ -n "$QUALIFIER" ]; then
            if [[ ! "$QUALIFIER" =~ ^(M[0-9]|RC[0-9]|SNAPSHOT)$ ]]; then
              echo "::error::Preliminary Release Qualifier '$QUALIFIER' must match M[0-9], RC[0-9] or SNAPSHOT."
              exit 1
            fi
            if [[ ! "$BASE_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
              echo "::error::Preliminary Release Qualifier can only be used for .0 versions. Current version is '$BASE_RELEASE_VERSION'."
              exit 1
            fi
            RELEASE_VERSION="${BASE_RELEASE_VERSION}-${QUALIFIER}"
            echo "⚙ Releasing version '$RELEASE_VERSION' (Preliminary Release)"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            RELEASE_VERSION="$BASE_RELEASE_VERSION"
            echo "⚙ Releasing version '$RELEASE_VERSION'"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Determine whether this is the newest release line
        id: latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          # A patch release of an older line (e.g. 1.0.5 after 1.1.0) must not take over the
          # GitHub "Latest" badge or the Docker tags `latest` / `v<major>`.
          set -euo pipefail
          stable_tags=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          newest() { printf '%s\n' "$@" | grep -v '^$' | sort -V | tail -n 1; }
          major="${VERSION%%.*}"
          if [ "$IS_PRERELEASE" = "true" ]; then
            is_latest=false; is_latest_major=false
          else
            newest_all=$(newest $stable_tags "$VERSION")
            newest_major=$(newest $(printf '%s\n' $stable_tags | grep -E "^${major}\." || true) "$VERSION")
            [ "$newest_all" = "$VERSION" ] && is_latest=true || is_latest=false
            [ "$newest_major" = "$VERSION" ] && is_latest_major=true || is_latest_major=false
          fi
          echo "Newest release overall: $is_latest, newest of major $major: $is_latest_major"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "is_latest_major=$is_latest_major" >> "$GITHUB_OUTPUT"


  release:
    name: Perform Release
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: write  # push the release commit, create the tag and GitHub release
    steps:
      - name: Check out the code  # zizmor: ignore[artipacked] credentials are needed to push the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set version
        id: set-version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/set-project-version.sh "$VERSION"

      - name: Maven Build
        run: |
          ./mvnw deploy
          find target -name maven-metadata.* -delete

      - name: Commit changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        if: ${{github.event.inputs.dry_run == 'false' }}
        with:
          message: "chore(release): Releasing version ${{needs.prepare.outputs.version}}"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restrict "latest" markers to the newest release line
        env:
          IS_LATEST: ${{ needs.prepare.outputs.is_latest }}
          IS_LATEST_MAJOR: ${{ needs.prepare.outputs.is_latest_major }}
        run: |
          set -euo pipefail
          if [ "$IS_LATEST" != "true" ]; then
            echo "Not the newest release: not marking the GitHub release as latest, not pushing Docker tag 'latest'."
            yq -i '.release.github.makeLatest = "false"' jreleaser.yml
            yq -i 'del(.packagers.docker.imageNames[] | select(. == "operaton/operaton-starter:latest"))' jreleaser.yml
          fi
          if [ "$IS_LATEST_MAJOR" != "true" ]; then
            echo "Not the newest release of its major version: not pushing Docker tag 'v<major>'."
            yq -i 'del(.packagers.docker.imageNames[] | select(. == "operaton/operaton-starter:v{{projectVersionMajor}}"))' jreleaser.yml
          fi
          yq '.release.github.makeLatest, .packagers.docker.imageNames' jreleaser.yml

      - name: Release with JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        env:
          JRELEASER_PROJECT_VERSION: ${{needs.prepare.outputs.version}}
          JRELEASER_DRY_RUN: ${{github.event.inputs.dry_run}}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PUBLIC_KEY: ${{secrets.GPG_PUBLIC_KEY}}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JRELEASER_DOCKER_DEFAULT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          JRELEASER_DOCKER_DEFAULT_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties

  post_release:
    name: Post-Release
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code  # zizmor: ignore[artipacked] credentials are needed to push the version bump
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the release branch
        run: |
          git pull

      - name: Delete snapshot release
        if: ${{github.event.inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SNAPSHOT_TAGS=(
            "${VERSION}-SNAPSHOT"
            "v${VERSION}-SNAPSHOT"
          )

          for SNAPSHOT_TAG in "${SNAPSHOT_TAGS[@]}"; do
            echo "Attempting to delete snapshot release: $SNAPSHOT_TAG"

            if gh release view "$SNAPSHOT_TAG" > /dev/null 2>&1; then
              echo "Found snapshot release $SNAPSHOT_TAG, deleting..."
              gh release delete "$SNAPSHOT_TAG" --yes --cleanup-tag
              echo "Successfully deleted snapshot release $SNAPSHOT_TAG"
            else
              echo "Snapshot release $SNAPSHOT_TAG not found, skipping deletion"
            fi
          done

      - name: Set next development version
        id: set-next-version
        env:
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          COMPUTED_NEXT_VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          if [ "$IS_PRERELEASE" == "true" ]; then
            NEXT_VERSION="${BASE_VERSION}-SNAPSHOT"
          else
            NEXT_VERSION="${COMPUTED_NEXT_VERSION}-SNAPSHOT"
          fi
          .github/scripts/set-project-version.sh "$NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Commit changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        if: ${{github.event.inputs.dry_run == 'false' }}
        with:
          message: "[releng] Bump version to ${{steps.set-next-version.outputs.next_version}}"
          pull: '--rebase --autostash'
        continue-on-error: true
