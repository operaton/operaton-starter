# Dependabot version updates (modeled after operaton/operaton).
# Auto-merge of eligible PRs is handled by .github/workflows/auto-merge.yml
# according to .github/auto-merge.config.yml.
# The labels below must exist in the repository for the auto-merge rules to match.

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:10"
    reviewers:
      - "kthoms"
    target-branch: "main"
    cooldown:  # zizmor: ignore[dependabot-cooldown] Spring Boot patches wanted immediately; intentional zero cooldown
      exclude:
        - "org.springframework.boot:*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies:maven"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.openapitools:openapi-generator-maven-plugin"
          - "com.github.eirslett:frontend-maven-plugin"
          - "org.sonatype.central:central-publishing-maven-plugin"

  - package-ecosystem: "npm"
    directory: "/starter-web"
    schedule:
      interval: "cron"
      cronjob: "33 2 * * 1,3,5"
    cooldown:
      default-days: 7
    reviewers:
      - "kthoms"
    target-branch: "main"
    labels:
      - "dependencies:npm"
    groups:
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
          - "pinia"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/starter-cli"
    schedule:
      interval: "cron"
      cronjob: "33 2 * * 1,3,5"
    cooldown:
      default-days: 7
    reviewers:
      - "kthoms"
    target-branch: "main"
    labels:
      - "dependencies:npm"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "19 2 * * 1,3,5"
    cooldown:
      default-days: 7
    reviewers:
      - "kthoms"
    target-branch: "main"
    labels:
      - "dependencies:github-action"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      3rd-party-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    reviewers:
      - "kthoms"
    target-branch: "main"
    labels:
      - "dependencies:docker"

  # ---------------------------------------------------------------------------
  # Maintenance branch release/1.0.x
  # Patch updates only. They run on Mondays so that the auto-merge workflow can
  # merge them before the weekly patch release (scheduled-release.yml, Tuesdays).
  # When a new maintenance branch is created, copy this block and adjust
  # target-branch; remove the block when the branch reaches end of life.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "release/1.0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies:maven"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.openapitools:openapi-generator-maven-plugin"
          - "com.github.eirslett:frontend-maven-plugin"

  - package-ecosystem: "npm"
    directory: "/starter-web"
    target-branch: "release/1.0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies:npm"
    groups:
      npm-patches:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/starter-cli"
    target-branch: "release/1.0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies:npm"
    groups:
      npm-patches:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/1.0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies:github-action"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      3rd-party-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "release/1.0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:40"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies:docker"
